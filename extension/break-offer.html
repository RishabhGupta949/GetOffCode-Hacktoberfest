<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TouchGrass - Break Offer</title>
  <style>
    * { box-sizing: border-box; }
    body { font: 16px/1.6 system-ui, sans-serif; margin: 0; padding: 40px 20px; background: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #1e293b; }
    .container { width: 100%; max-width: 480px; background: #fff; border-radius: 16px; box-shadow: 0 10px 40px -10px rgba(15,23,42,0.15); padding: 40px; text-align: center; }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h1 { margin: 0 0 8px; font-size: 28px; font-weight: 700; color: #0f172a; }
    .subtitle { color: #64748b; font-size: 16px; margin: 0 0 24px; }
    .offer-card { background: #fff8e1; border: 1px solid #ffd54f; border-radius: 12px; padding: 24px; margin-bottom: 24px; text-align: left; }
    .offer-title { font-weight: 600; font-size: 18px; color: #0f172a; margin-bottom: 8px; }
    .offer-desc { color: #64748b; font-size: 14px; margin-bottom: 16px; }
    .offer-meta { display: flex; gap: 16px; font-size: 13px; color: #94a3b8; }
    .offer-reason { font-size: 13px; color: #475569; margin: 0 0 16px; line-height: 1.5; }
    .offer-source { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
    .offer-source.ai { background: #e0f2fe; color: #075985; }
    .offer-source.fallback { background: #fef3c7; color: #92400e; }
    .offer-source.demo { background: #ede9fe; color: #5b21b6; }
    .actions { display: flex; gap: 12px; }
    .actions button { flex: 1; padding: 14px 24px; border: none; border-radius: 8px; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.15s; }
    .btn-primary { background: #1976d2; color: #fff; }
    .btn-primary:hover { background: #1565c0; }
    .btn-secondary { background: #f5f5f5; color: #333; border: 1px solid #ddd; }
    .btn-secondary:hover { background: #eee; }
    .demo-badge { display: inline-block; background: #e0e0e0; color: #424242; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-left: 8px; vertical-align: middle; }
    .hidden { display: none !important; }
    .error { color: #c62828; font-size: 13px; margin-top: 16px; min-height: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🌿</div>
    <h1>Time for a break?<span id="demoBadge" class="demo-badge hidden">DEMO</span></h1>
    <p class="subtitle">You've been stuck on this problem. A short break can help.</p>

    <div class="offer-card" id="offerCard">
      <div class="offer-title" id="offerTitle"></div>
      <div class="offer-desc" id="offerDesc"></div>
      <div class="offer-reason" id="offerReason"></div>
      <div class="offer-meta">
        <span id="offerDuration"></span>
        <span id="offerType"></span>
        <span class="offer-source" id="offerSource"></span>
      </div>
    </div>

    <div class="actions">
      <button id="btnAccept" class="btn-primary">Start Break</button>
      <button id="btnDismiss" class="btn-secondary">Not Now</button>
    </div>

    <div class="error" id="errorMsg"></div>
    <p id="demoNote" style="display:none; font-size: 12px; color: #5b21b6; margin: 12px 0 0; line-height: 1.5;">
      Demo mode: triggered after 15 seconds of active browsing. The AI still chose this
      break and its duration — 15 seconds is only the evaluation trigger.
    </p>
  </div>

  <script src="break-offer.js"></script>
</body>
</html>
